<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CaothangBaka Link Decoder</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0f14;
      --surface: #161b24;
      --surface2: #1e2535;
      --border: #2a3347;
      --accent: #00e5ff;
      --accent-dim: rgba(0, 229, 255, 0.12);
      --accent-glow: rgba(0, 229, 255, 0.25);
      --text: #e8edf5;
      --text-muted: #6b7a96;
      --success: #00e676;
      --danger: #ff4d6d;
      --warning: #ffd166;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    .header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #0d0f14 0%, #131926 100%);
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 100px; height: 100px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
    }
    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--accent-dim);
      border: 1px solid rgba(0,229,255,0.2);
      border-radius: 20px;
      padding: 2px 8px;
      margin-bottom: 6px;
    }
    .header-badge-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 2s infinite;
    }
    .header-badge span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      line-height: 1.2;
    }
    .header h1 span { color: var(--accent); }
    .header p {
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .body { padding: 18px 20px; }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .field-label span {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .status-chip.saved {
      background: rgba(0, 230, 118, 0.12);
      border: 1px solid rgba(0, 230, 118, 0.25);
      color: var(--success);
      opacity: 1;
    }
    .status-chip.empty {
      background: rgba(255, 77, 109, 0.1);
      border: 1px solid rgba(255, 77, 109, 0.2);
      color: var(--danger);
      opacity: 1;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 10px;
    }
    .input-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 40px 10px 12px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      letter-spacing: 0.02em;
    }
    .input-wrap input::placeholder { color: var(--text-muted); letter-spacing: 0; }
    .input-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
      background: var(--surface2);
    }
    .toggle-vis {
      position: absolute;
      right: 10px; top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 2px;
      line-height: 1;
      transition: color 0.2s;
    }
    .toggle-vis:hover { color: var(--accent); }
    .toggle-vis svg { display: block; }

    .btn-save {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #00b8d4, #00e5ff);
      color: #040810;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(0,229,255,0.2);
    }
    .btn-save:hover {
      opacity: 0.9;
      box-shadow: 0 6px 22px rgba(0,229,255,0.35);
      transform: translateY(-1px);
    }
    .btn-save:active { transform: translateY(0); opacity: 1; }
    .btn-save.loading { pointer-events: none; opacity: 0.7; }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .btn-getkey {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      text-decoration: none;
    }
    .btn-getkey:hover {
      border-color: rgba(0,229,255,0.35);
      color: var(--accent);
      background: var(--accent-dim);
    }
    .btn-getkey svg { flex-shrink: 0; }

    .key-preview {
      margin-top: 14px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: none;
    }
    .key-preview.visible { display: flex; align-items: center; gap: 8px; }
    .key-preview-icon { color: var(--success); flex-shrink: 0; }
    .key-preview-text { flex: 1; min-width: 0; }
    .key-preview-label { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    .key-preview-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .key-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .icon-action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 5px;
      border-radius: 4px;
      transition: color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-action-btn:hover { color: var(--accent); background: var(--accent-dim); }
    .btn-delete:hover { color: var(--danger); background: rgba(255,77,109,0.1); }

    .toast {
      position: fixed;
      bottom: 14px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 99;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(0,230,118,0.3); color: var(--success); }
    .toast.error { border-color: rgba(255,77,109,0.3); color: var(--danger); }

    .footer {
      padding: 10px 20px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer span { font-size: 10px; color: var(--text-muted); }
    .footer a { font-size: 10px; color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    .footer a:hover { color: var(--accent); }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-badge">
      <div class="header-badge-dot"></div>
      <span>Groq API</span>
    </div>
    <h1>Link <span>Decoder</span></h1>
    <p>Cấu hình API Key để giải mã link</p>
  </div>

  <div class="body">
    <div class="field-label">
      <span>Groq API Key</span>
      <div class="status-chip" id="statusChip"></div>
    </div>

    <div class="input-wrap">
      <input type="password" id="apiKeyInput" placeholder="gsk_••••••••••••••••••••••">
      <button class="toggle-vis" id="toggleVis" title="Hiện/Ẩn key">
        <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <button class="btn-save" id="saveBtn">
      Lưu API Key
    </button>

    <div id="keyPreview" class="key-preview">
      <svg class="key-preview-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <div class="key-preview-text">
        <div class="key-preview-label">Key đang dùng</div>
        <div class="key-preview-val" id="keyPreviewVal"></div>
      </div>
      <div class="key-actions">
        <button class="icon-action-btn" id="copyKeyBtn" title="Sao chép API Key">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
        <button class="icon-action-btn btn-delete" id="deleteBtn" title="Xóa API Key">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="divider"><span>Chưa có key?</span></div>

    <a class="btn-getkey" href="https://console.groq.com/keys" target="_blank" id="groqLink">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      Lấy key miễn phí tại console.groq.com
    </a>
  </div>

  <div class="footer">
    <span>CaothangBaka Link Decoder v4.0</span>
    <a href="#" id="clearCacheLink">Xóa cache</a>
  </div>

  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
